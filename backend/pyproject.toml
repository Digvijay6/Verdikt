[project]
name = "verdikt-backend"
version = "0.1.0"
description = "Verdikt — API and voice worker"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "supabase>=2.10",
    "google-genai>=1.0",
    "livekit-agents>=1.6",
    "livekit-plugins-google>=1.6",
    "resend>=2.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["ruff>=0.8", "pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["shared*", "api*", "voice*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
