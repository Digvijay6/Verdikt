[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    # google-adk 2.7.1 deprecates SequentialAgent/ParallelAgent/LoopAgent in
    # favour of the Workflow graph API. Known and deliberate — see D22. Silenced
    # so it does not drown real warnings; delete this line when we migrate.
    ignore:.*deprecated in favor of Workflow.*:DeprecationWarning
    ignore::DeprecationWarning:google.genai.*
